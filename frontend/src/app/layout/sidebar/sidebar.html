<aside class="flex h-full flex-col rounded-lg bg-base">
  <header class="flex items-center justify-between px-4 pt-3 pb-2">
    <h2 class="flex items-center gap-3 font-bold text-subdued">
      <app-icon name="library" />
      Your Library
    </h2>
    <button
      type="button"
      class="btn-icon size-8 hover:bg-highlight"
      disabled
      title="Playlists are coming soon"
      aria-label="Create playlist"
    >
      <app-icon name="plus" [size]="18" />
    </button>
  </header>

  <div class="flex-1 space-y-4 overflow-y-auto px-2 pb-2">
    <section class="rounded-lg bg-elevated px-5 py-4">
      <h3 class="font-bold">Create your first playlist</h3>
      <p class="mt-2 text-sm">It's easy, we'll help you</p>
      <button type="button" class="mt-5 rounded-full bg-white px-4 py-1.5 text-sm font-bold text-black opacity-60" disabled>
        Coming soon
      </button>
    </section>

    <section class="rounded-lg bg-elevated px-5 py-4">
      <h3 class="font-bold">Find something to listen to</h3>
      <p class="mt-2 text-sm">Search for songs, artists and albums</p>
      <a
        routerLink="/search"
        class="mt-5 inline-block rounded-full bg-white px-4 py-1.5 text-sm font-bold text-black transition-transform hover:scale-105"
        >Browse</a
      >
    </section>
  </div>
</aside>
