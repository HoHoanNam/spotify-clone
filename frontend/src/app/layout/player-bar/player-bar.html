<footer class="grid h-18 grid-cols-[1fr_auto] items-center gap-4 px-2 md:grid-cols-[minmax(180px,1fr)_minmax(0,2fr)_minmax(180px,1fr)]">
  <!-- Now playing -->
  <div class="flex min-w-0 items-center gap-3">
    @if (player.current(); as track) {
      <app-cover-image class="size-14 shrink-0 rounded" [src]="track.coverUrl" [alt]="track.title" [iconSize]="24" />
      <div class="min-w-0">
        @if (track.album; as album) {
          <a [routerLink]="['/album', album.id]" class="block truncate text-sm hover:underline">{{ track.title }}</a>
        } @else {
          <p class="truncate text-sm">{{ track.title }}</p>
        }
        <p class="truncate text-xs text-subdued"><app-artist-links [artists]="track.artists" /></p>
      </div>
      <app-like-button [track]="track" class="ml-2 shrink-0" />
    }
  </div>

  <!-- Controls + progress -->
  <div class="flex flex-col items-center gap-1 max-md:items-end">
    <div class="flex items-center gap-4">
      <button
        type="button"
        class="btn-icon relative size-8 max-md:hidden"
        [class.text-accent]="player.shuffle()"
        [attr.aria-pressed]="player.shuffle()"
        aria-label="Shuffle"
        [disabled]="!player.current()"
        (click)="player.toggleShuffle()"
      >
        <app-icon name="shuffle" [size]="18" />
        @if (player.shuffle()) {
          <span class="absolute bottom-0 size-1 rounded-full bg-accent"></span>
        }
      </button>
      <button
        type="button"
        class="btn-icon size-8 max-md:hidden"
        aria-label="Previous"
        [disabled]="!player.hasPrevious()"
        (click)="player.previous()"
      >
        <app-icon name="previous" [size]="20" />
      </button>
      <button
        type="button"
        class="flex size-8 items-center justify-center rounded-full bg-white text-black transition-transform hover:scale-105 active:scale-100 disabled:opacity-40"
        [attr.aria-label]="player.isPlaying() ? 'Pause' : 'Play'"
        [disabled]="!player.current()"
        (click)="player.toggle()"
      >
        <app-icon [name]="player.isPlaying() ? 'pause' : 'play'" [size]="18" />
      </button>
      <button type="button" class="btn-icon size-8" aria-label="Next" [disabled]="!player.hasNext()" (click)="player.next()">
        <app-icon name="next" [size]="20" />
      </button>
      <button
        type="button"
        class="btn-icon relative size-8 max-md:hidden"
        [class.text-accent]="player.repeat() !== 'off'"
        [attr.aria-label]="'Repeat: ' + player.repeat()"
        [disabled]="!player.current()"
        (click)="player.cycleRepeat()"
      >
        <app-icon [name]="player.repeat() === 'one' ? 'repeatOne' : 'repeat'" [size]="18" />
        @if (player.repeat() !== 'off') {
          <span class="absolute bottom-0 size-1 rounded-full bg-accent"></span>
        }
      </button>
    </div>

    <div class="flex w-full items-center gap-2 text-xs text-subdued tabular-nums max-md:hidden">
      <span class="w-10 text-right">{{ shownTime() | duration }}</span>
      <input
        type="range"
        class="slider"
        min="0"
        step="1"
        aria-label="Seek"
        [max]="player.duration() || 0"
        [value]="shownTime()"
        [style.--fill]="fillPercent() + '%'"
        [disabled]="!player.current()"
        (input)="dragTime.set(+$any($event.target).value)"
        (change)="commitSeek(+$any($event.target).value)"
      />
      <span class="w-10">{{ player.duration() | duration }}</span>
    </div>
  </div>

  <!-- Queue + volume -->
  <div class="flex items-center justify-end gap-2 max-md:hidden">
    <button
      type="button"
      class="btn-icon relative size-8"
      [class.text-accent]="layout.queueOpen()"
      [attr.aria-pressed]="layout.queueOpen()"
      aria-label="Queue"
      title="Queue"
      (click)="layout.toggleQueue()"
    >
      <app-icon name="queue" [size]="18" />
      @if (layout.queueOpen()) {
        <span class="absolute bottom-0 size-1 rounded-full bg-accent"></span>
      }
    </button>
    <button
      type="button"
      class="btn-icon size-8"
      [attr.aria-label]="player.muted() ? 'Unmute' : 'Mute'"
      (click)="player.toggleMute()"
    >
      <app-icon [name]="volumeIcon()" [size]="18" />
    </button>
    <input
      type="range"
      class="slider max-w-24"
      min="0"
      max="1"
      step="0.01"
      aria-label="Volume"
      [value]="player.muted() ? 0 : player.volume()"
      [style.--fill]="(player.muted() ? 0 : player.volume()) * 100 + '%'"
      (input)="player.setVolume(+$any($event.target).value)"
    />
  </div>
</footer>
