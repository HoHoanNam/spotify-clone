<div class="mx-auto max-w-2xl px-4 pt-8 pb-12 sm:px-6">
  <h1 class="mb-8 text-3xl font-bold tracking-tight">Settings</h1>

  <!-- Profile -->
  <section class="mb-6 rounded-lg bg-elevated p-6">
    <h2 class="mb-5 text-xl font-bold">Profile</h2>
    <div class="flex flex-col gap-6 sm:flex-row sm:items-center">
      <div class="group relative size-32 shrink-0 self-center">
        <app-cover-image
          class="size-full shadow-[0_4px_60px_rgb(0_0_0/0.5)]"
          [src]="auth.user()?.avatarUrl"
          [round]="true"
          placeholder="person"
          [iconSize]="48"
        />
        <label
          class="absolute inset-0 flex cursor-pointer flex-col items-center justify-center gap-1 rounded-full bg-black/70 text-sm font-bold opacity-0 transition-opacity group-hover:opacity-100 focus-within:opacity-100"
          [class.opacity-100]="savingAvatar()"
        >
          <app-icon name="edit" [size]="28" />
          {{ savingAvatar() ? 'Uploading…' : 'Choose photo' }}
          <input #avatar type="file" accept=".jpg,.jpeg,.png,.webp" class="sr-only" [disabled]="savingAvatar()" (change)="pickAvatar(avatar)" />
        </label>
      </div>

      <form [formGroup]="profileForm" (ngSubmit)="saveName()" class="flex flex-1 flex-col gap-3" novalidate>
        <label class="block">
          <span class="mb-2 block text-sm font-bold">Display name</span>
          <input formControlName="username" class="field" maxlength="100" [class.invalid]="showError(profileForm.controls.username)" />
        </label>
        <div class="flex flex-wrap items-center gap-3">
          <button type="submit" class="btn-primary px-6 py-2" [disabled]="savingName()">Save</button>
          @if (auth.user()?.avatarUrl) {
            <button type="button" class="btn-outline" [disabled]="savingAvatar()" (click)="removeAvatar()">Remove photo</button>
          }
        </div>
      </form>
    </div>
    <p class="mt-5 text-sm text-subdued">Email: {{ auth.user()?.email }}</p>
  </section>

  <!-- Password -->
  <section class="rounded-lg bg-elevated p-6">
    <h2 class="mb-5 text-xl font-bold">Change password</h2>
    <form [formGroup]="passwordForm" (ngSubmit)="changePassword()" class="flex flex-col gap-5" novalidate>
      <label class="block">
        <span class="mb-2 block text-sm font-bold">Current password</span>
        <input
          type="password"
          formControlName="currentPassword"
          autocomplete="current-password"
          class="field"
          [class.invalid]="showError(passwordForm.controls.currentPassword)"
        />
      </label>
      <label class="block">
        <span class="mb-2 block text-sm font-bold">New password</span>
        <input
          type="password"
          formControlName="newPassword"
          autocomplete="new-password"
          class="field"
          [class.invalid]="showError(passwordForm.controls.newPassword)"
        />
        @if (showError(passwordForm.controls.newPassword)) {
          <span class="mt-2 block text-sm text-danger">Use at least 8 characters.</span>
        }
      </label>
      <label class="block">
        <span class="mb-2 block text-sm font-bold">Repeat new password</span>
        <input
          type="password"
          formControlName="confirm"
          autocomplete="new-password"
          class="field"
          [class.invalid]="passwordForm.hasError('mismatch') && passwordForm.controls.confirm.touched"
        />
        @if (passwordForm.hasError('mismatch') && passwordForm.controls.confirm.touched) {
          <span class="mt-2 block text-sm text-danger">The passwords don't match.</span>
        }
      </label>
      @if (passwordError(); as message) {
        <p class="text-sm text-danger">{{ message }}</p>
      }
      <div>
        <button type="submit" class="btn-primary px-6 py-2" [disabled]="savingPassword()">Change password</button>
      </div>
    </form>
  </section>
</div>
