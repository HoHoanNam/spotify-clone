<div class="grid gap-10 xl:grid-cols-[380px_1fr]">
  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4 self-start rounded-lg bg-elevated p-6" novalidate>
    <h2 class="text-xl font-bold">New artist</h2>
    <label class="block">
      <span class="mb-2 block text-sm font-bold">Name</span>
      <input formControlName="name" class="field" [class.invalid]="invalid('name')" />
    </label>
    <label class="block">
      <span class="mb-2 block text-sm font-bold">Bio <span class="font-normal text-subdued">(optional)</span></span>
      <textarea formControlName="bio" rows="4" class="field resize-y"></textarea>
    </label>
    <app-file-field label="Image" accept=".jpg,.jpeg,.png,.webp" hint="JPG, PNG or WebP" [(file)]="image" />

    @if (progress() !== null) {
      <div class="h-1 overflow-hidden rounded-full bg-white/10"><div class="h-full bg-accent" [style.width.%]="progress()"></div></div>
    }
    <button type="submit" class="btn-primary w-full" [disabled]="progress() !== null">Create artist</button>
  </form>

  <section>
    <h2 class="mb-4 text-xl font-bold">Artists</h2>
    @if (artists(); as artists) {
      @if (!artists.length) {
        <p class="text-subdued">No artists yet.</p>
      }
      <ul class="divide-y divide-white/5">
        @for (artist of artists; track artist.id) {
          <li class="flex items-center gap-4 py-2">
            <app-cover-image class="size-12 shrink-0" [src]="artist.imageUrl" [round]="true" placeholder="person" [iconSize]="20" />
            <a [routerLink]="['/artist', artist.id]" class="flex-1 truncate font-semibold hover:underline">{{ artist.name }}</a>
            <button type="button" class="btn-icon size-9 hover:bg-white/10 hover:text-danger" [attr.aria-label]="'Delete ' + artist.name" (click)="remove(artist)">
              <app-icon name="trash" [size]="18" />
            </button>
          </li>
        }
      </ul>
    } @else {
      <app-page-status [error]="error()" />
    }
  </section>
</div>
