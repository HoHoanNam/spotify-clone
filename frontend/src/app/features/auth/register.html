<app-auth-layout heading="Sign up to start listening">
  @if (error()) {
    <p role="alert" class="mb-6 rounded bg-[#e91429] px-4 py-3 text-sm font-medium">{{ error() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4" novalidate>
    <label class="block">
      <span class="mb-2 block text-sm font-bold">Email address</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="name@domain.com"
        class="field"
        [class.invalid]="showError('email')"
      />
      @if (showError('email')) {
        <span class="mt-2 block text-sm text-danger">This email is invalid. Make sure it's written like example&#64;email.com</span>
      }
    </label>

    <label class="block">
      <span class="mb-2 block text-sm font-bold">Password</span>
      <input
        type="password"
        formControlName="password"
        autocomplete="new-password"
        placeholder="At least 8 characters"
        class="field"
        [class.invalid]="showError('password')"
      />
      @if (showError('password')) {
        <span class="mt-2 block text-sm text-danger">Password must be 8–72 characters.</span>
      }
    </label>

    <label class="block">
      <span class="mb-2 block text-sm font-bold">Name</span>
      <span class="mb-2 block text-sm text-subdued">This appears on your profile.</span>
      <input
        type="text"
        formControlName="username"
        autocomplete="nickname"
        class="field"
        [class.invalid]="showError('username')"
      />
      @if (showError('username')) {
        <span class="mt-2 block text-sm text-danger">Enter a name for your profile.</span>
      }
    </label>

    <button type="submit" class="btn-primary mt-4 w-full" [disabled]="submitting()">
      {{ submitting() ? 'Creating account…' : 'Sign up' }}
    </button>
  </form>

  <hr class="my-8 border-white/10" />
  <p class="text-center text-subdued">
    Already have an account?
    <a routerLink="/login" class="font-semibold text-white underline hover:text-accent">Log in here</a>
  </p>
</app-auth-layout>
