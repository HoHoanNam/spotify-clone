@if (src() && !failed()) {
  <img
    [src]="src()"
    [alt]="alt()"
    loading="lazy"
    class="size-full object-cover"
    (error)="failed.set(true)"
  />
} @else {
  <div class="flex size-full items-center justify-center text-muted">
    <app-icon [name]="placeholder()" [size]="iconSize()" />
  </div>
}
