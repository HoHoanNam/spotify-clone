@if (error(); as message) {
  <div class="px-6 py-24 text-center">
    <p class="text-2xl font-bold">Something went wrong</p>
    <p class="mt-2 text-subdued">{{ message }}</p>
  </div>
} @else {
  <div class="flex justify-center py-24" role="status" aria-label="Loading">
    <span class="size-10 animate-spin rounded-full border-4 border-white/10 border-t-accent"></span>
  </div>
}
