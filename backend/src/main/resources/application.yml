spring:
  application:
    name: spotify-clone
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    # Machine-specific overrides (DB password, ...). Gitignored; copy from application-local.example.yml.
    import: optional:file:./application-local.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spotify_clone}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          '[time_zone]': UTC
        # Load lazy associations (track.artists, track.album...) for a whole page in a few IN (...) queries, not N+1
        '[default_batch_fetch_size]': 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    error:
      include-stacktrace: never
  data:
    web:
      pageable:
        max-page-size: 50   # ?size=10000 is capped at 50
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

server:
  port: ${SERVER_PORT:8080}

app:
  storage:
    root: ${STORAGE_ROOT:./storage}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    # Base64-encoded HMAC key (>= 256 bit). MUST be overridden outside dev.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1wbGVhc2UtYXQtbGVhc3QtMzItYnl0ZXM=}
    access-token-ttl: ${JWT_ACCESS_TTL:24h}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    # jaudiotagger is very chatty at INFO
    '[org.jaudiotagger]': WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
